[package]
name = "atlas-server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "Atlas Todo backend: Axum HTTP + WebSocket API over PostgreSQL."

[dependencies]
atlas-core = { path = "../atlas-core" }
axum = { version = "0.8", features = ["ws"] }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tower = "0.5"
tower-http = { version = "0.7", features = ["trace", "cors", "fs", "request-id"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
time = { workspace = true }
thiserror = { workspace = true }
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls-ring",
    "postgres",
    "macros",
    "uuid",
    "time",
    "json",
    "migrate",
] }
argon2 = "0.6"
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
rand = "0.10"
sha2 = "0.11"
hex = "0.4"
hmac = "0.13"
hkdf = "0.13"
aes-gcm = "0.11"
x25519-dalek = { version = "3", features = ["static_secrets"] }
base64 = "0.23"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
object_store = { version = "0.14.2", default-features = false, features = ["aws"] }
p256 = { version = "0.13", features = ["ecdsa"] }
ed25519-dalek = "2"
rsa = { version = "0.9", features = ["sha2"] }
ciborium = "0.2"

[features]
# Exposes `auth::webauthn::soft`, a software authenticator, to the integration tests.
test-authenticator = []

[dev-dependencies]
atlas-server = { path = ".", features = ["test-authenticator"] }
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
tokio-tungstenite = "0.30"
futures-util = "0.3"
