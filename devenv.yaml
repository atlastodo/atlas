# yaml-language-server: $schema=https://devenv.sh/devenv.schema.json
inputs:
  # This repository's own flake: devenv takes nixpkgs and rust-overlay from its flake.lock, so the
  # shell, the flake's packages and the NixOS module all build from one pin. `nix flake update`
  # moves them; `devenv update` then copies them into devenv.lock (`lint` checks the two agree).
  # A relative path input is locked without a hash, so editing the repository doesn't touch it.
  atlas:
    url: path:.
  nixpkgs:
    follows: atlas/nixpkgs
  # Provides the Rust toolchain for languages.rust (version from rust-toolchain.toml).
  rust-overlay:
    follows: atlas/rust-overlay
  # Pre-commit / git hook integration used by git-hooks.hooks below.
  git-hooks:
    url: github:cachix/git-hooks.nix
    inputs:
      nixpkgs:
        follows: nixpkgs

# If you're using non-OSS software, you can set allow_unfree to true.
allow_unfree: true

# If you're not willing to allow unsupported packages:
# allow_unsupported_system: false

# If you're willing to use a package that's vulnerable
# permitted_insecure_packages:
#  - "openssl-1.1.1w"

# If you have more than one devenv you can merge them
#imports:
# - ./backend
