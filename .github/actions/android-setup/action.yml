# The Android release build's toolchain and caches, shared by release.yml (the signed build on a
# tag) and android-cache.yml (the unsigned build on main that fills the caches).
#
# GitHub only lets a run read caches saved on its own ref or on the default branch, so a tag run
# never sees what an earlier tag saved. The caches are therefore written on main only
# (android-cache.yml) and read everywhere else:
# - Gradle (~/.gradle: dependencies, wrapper, the build cache for Kotlin/Java/dex outputs):
#   setup-gradle, read-only off the default branch by default.
# - The NDKs and CMake that AGP installs on demand (~1 GB a run otherwise).
# - ccache for the native C++ (React Native, Reanimated, Worklets, Expo...), which Gradle's build
#   cache cannot reuse. CMake 3.17+ reads CMAKE_<LANG>_COMPILER_LAUNCHER from the environment, so
#   every library's CMake project goes through it (RN's own app CMake also adds ccache when found;
#   ccache strips the doubled launcher).
name: Android setup
description: Java, the Android SDK, Node, Bun, deps, the prebuilt native project and the build caches.

inputs:
  node-version:
    required: true
  bun-version:
    required: true

outputs:
  sdk-paths:
    description: The SDK packages AGP installs on demand, for actions/cache/save.
    value: ${{ steps.sdk.outputs.paths }}
  sdk-key:
    description: The cache key for those packages.
    value: ${{ steps.sdk.outputs.key }}
  sdk-hit:
    description: Whether they were restored by exact key.
    value: ${{ steps.sdk-cache.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
      with:
        distribution: temurin
        java-version: "17"
    # Pinned cmdline-tools + accepted licences, so AGP can fetch the exact NDK/CMake/platform
    # React Native asks for.
    - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ inputs.node-version }}
        package-manager-cache: false
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: ${{ inputs.bun-version }}
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
        restore-keys: bun-${{ runner.os }}-
    - shell: bash
      run: bun install --frozen-lockfile

    # The NDKs and CMake the build installs (React Native's ndkVersion, plus one a library pins).
    # A version change is only a cache miss: AGP downloads what is missing, and the next run on
    # main saves the new set under its new key.
    - id: sdk
      shell: bash
      run: |
        packages="ndk/27.1.12297006 ndk/27.0.12077973 cmake/3.22.1"
        {
          echo "key=android-sdk-${runner_os}-$(echo "$packages" | tr ' /' '-_')"
          echo "paths<<EOF"
          for p in $packages; do echo "$ANDROID_HOME/$p"; done
          echo "EOF"
        } >> "$GITHUB_OUTPUT"
      env:
        runner_os: ${{ runner.os }}
    - id: sdk-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.sdk.outputs.paths }}
        key: ${{ steps.sdk.outputs.key }}

    - name: Install ccache
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq ccache
        {
          echo "CCACHE_DIR=$HOME/.ccache"
          # Paths relative to the checkout, and no cwd in the hash, so hits survive a different
          # working directory; the compiler is hashed by content (the NDK's mtime changes on restore).
          echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE"
          echo "CCACHE_NOHASHDIR=true"
          echo "CCACHE_COMPILERCHECK=content"
          echo "CCACHE_MAXSIZE=2G"
          echo "CMAKE_C_COMPILER_LAUNCHER=ccache"
          echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache"
        } >> "$GITHUB_ENV"
    # Saved under a new key per run on main (a cache entry is immutable); the newest one restores.
    - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.ccache
        key: ccache-android-${{ runner.os }}-${{ github.run_id }}
        restore-keys: ccache-android-${{ runner.os }}-
    - shell: bash
      run: ccache --zero-stats

    # Writes only on the default branch (its default), so tag runs read main's cache.
    - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      with:
        cache-cleanup: on-success

    - name: Generate the native project
      shell: bash
      working-directory: apps/mobile
      run: bunx expo prebuild --platform android --clean
