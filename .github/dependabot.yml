# Weekly dependency updates. Minor/patch bumps arrive as one grouped PR per ecosystem; majors
# stay separate so each gets its own review. Commit prefixes follow Conventional Commits.
#
# Version updates target `dev`, where work lands (`main` takes only the release PR from dev).
# They wait three days after a release (`cooldown`), a buffer against hijacked releases; security
# updates (a repository setting, not this file) never wait and always target the default branch,
# `main`. A bun PR's `nix/bun.nix` is regenerated by the `Dependabot bun.nix` workflow.
#
# What Dependabot can't update (devenv/flake locks, the Bun pins, transitive dependencies in
# bun.lock and Cargo.lock, the app web pins in apps.lock.json) is refreshed weekly by
# `deps-refresh.yml`.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    commit-message:
      prefix: chore
      include: scope
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]

  # rust-toolchain.toml: the one Rust that devenv, CI, the image and the flake build with. The group
  # gives the branch the `-minor-patch-` name deps-automerge.yml merges on green CI.
  - package-ecosystem: rust-toolchain
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    commit-message:
      prefix: chore
      include: scope
    groups:
      rust-toolchain-minor-patch:
        update-types: [minor, patch]

  # Bun workspace (root bun.lock covers packages/*). Bun itself follows the flake's nixpkgs (which
  # devenv shares), moved by deps-refresh.yml.
  - package-ecosystem: bun
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    commit-message:
      prefix: chore
      include: scope
    groups:
      bun-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /docker
    target-branch: dev
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    commit-message:
      prefix: chore
      include: scope
    groups:
      docker-minor-patch:
        update-types: [minor, patch]
