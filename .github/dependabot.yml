# Weekly dependency updates. Minor/patch bumps arrive as one grouped PR per ecosystem; majors
# stay separate so each gets its own review. Commit prefixes follow Conventional Commits.
#
# Version updates target `dev`, where work lands (`main` takes only the release PR from dev).
# Security updates (a repository setting, not this file) always target the default branch, `main`.
# A bun PR's `nix/bun.nix` is regenerated by the `Dependabot bun.nix` workflow.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]

  # Bun workspace (root bun.lock covers packages/*). Bun itself is pinned in lockstep
  # across devenv and the workflows, so Dependabot does not touch it.
  - package-ecosystem: bun
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      bun-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /docker
    target-branch: dev
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      docker-minor-patch:
        update-types: [minor, patch]
