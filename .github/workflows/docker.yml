# Builds and publishes the server image (the sync server plus the web app): one image per
# architecture pushed by digest, then a multi-arch index tagged with `tags`. Called by release.yml
# (a v* tag) and dev-image.yml (the moving `dev` tag for the dev branch).
name: Docker image

on:
  workflow_call:
    inputs:
      tags:
        description: docker/metadata-action `tags` for the multi-arch image.
        required: true
        type: string
      flavor:
        description: docker/metadata-action `flavor`.
        required: false
        type: string
        default: latest=false
      image-aliases:
        description: >-
          Extra image names (whitespace-separated ghcr.io/<owner>/<name> or docker.io/<owner>/<name>,
          e.g. ghcr.io/atlastodo/atlas-todo) that get the same tags as ghcr.io/<owner>/<repo>.
          Empty falls back to the IMAGE_ALIASES repository variable; both empty (the default)
          pushes the usual names only.
        required: false
        type: string
        default: ""

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  NODE_VERSION: "26"
  BUN_VERSION: "1.4.2"
  # OCI labels and annotations for the server image; GHCR shows the description and licence.
  IMAGE_METADATA: |
    org.opencontainers.image.title=Atlas Todo server
    org.opencontainers.image.description=Self-hosted Atlas Todo: the sync server and the web app (Rust, PostgreSQL)
    org.opencontainers.image.licenses=AGPL-3.0-only
    org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
    org.opencontainers.image.documentation=${{ github.server_url }}/${{ github.repository }}/blob/main/docs/self-hosting.md

jobs:
  # The licences of the third-party code in the image (the server's crates and the web app's
  # packages), as /usr/share/doc/atlas-todo/THIRD_PARTY_NOTICES.txt. A release also attaches it.
  notices:
    name: Third-party notices
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      # Only the package.json files are read: no install scripts. Cargo comes with the runner.
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: node scripts/third-party-licenses.mjs --notices THIRD_PARTY_NOTICES.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: third-party-notices
          path: THIRD_PARTY_NOTICES.txt
          retention-days: 7

  # One image per architecture, pushed by digest; merge tags the multi-arch index. arm64 hosted
  # runners are free only for public repositories, so a private repo builds amd64 alone.
  build:
    name: Docker image (${{ matrix.arch }})
    needs: notices
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include: ${{ fromJSON(github.event.repository.private && '[{"arch":"amd64","runner":"ubuntu-24.04"}]' || '[{"arch":"amd64","runner":"ubuntu-24.04"},{"arch":"arm64","runner":"ubuntu-24.04-arm"}]') }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: third-party-notices
      - name: Image name
        id: image
        # GHCR names must be lowercase (Owner/Repo -> ghcr.io/owner/repo); a fork
        # publishes under its own owner automatically.
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      # The web app: built from apps/mobile (the default), or, when apps.lock.json pins "todo"
      # (a url and sha256), that release asset, downloaded and verified by docker/Dockerfile.
      - name: Web app pin
        id: web
        run: |
          {
            echo "args<<BUILD_ARGS"
            if [ -f apps.lock.json ] && jq -e '.todo.url // empty' apps.lock.json >/dev/null; then
              jq -er '"TODO_WEB_FROM=release", "TODO_WEB_URL=\(.todo.url)", "TODO_WEB_SHA256=\(.todo.sha256 // error("apps.lock.json: todo has a url but no sha256"))"' apps.lock.json || exit 1
              jq -r '"Web app: the pinned todo \(.todo.version) web build (\(.todo.url))"' apps.lock.json >> "$GITHUB_STEP_SUMMARY"
            else
              echo "TODO_WEB_FROM=source"
              echo "Web app: built from apps/mobile" >> "$GITHUB_STEP_SUMMARY"
            fi
            echo "BUILD_ARGS"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest
        with:
          images: ${{ steps.image.outputs.name }}
          labels: ${{ env.IMAGE_METADATA }}
          annotations: ${{ env.IMAGE_METADATA }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          # Its build-record artifact would otherwise be swept into the release assets.
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=true
          # BuildKit's SLSA provenance (with the build's full inputs) and an SBOM, attached to the image.
          provenance: mode=max
          sbom: true
          # The web app's About screen links to the source it was built from (a source build), and
          # the web app pin above.
          build-args: |
            REPO_URL=${{ github.server_url }}/${{ github.repository }}
            ${{ steps.web.outputs.args }}
          # Registry cache, not type=gha: Actions caches written on a tag ref are invisible to the
          # next tag, so only a registry cache carries the cargo/bun layers between builds. Release
          # and dev builds share it.
          cache-from: type=registry,ref=${{ steps.image.outputs.name }}:buildcache-${{ matrix.arch }}
          cache-to: type=registry,ref=${{ steps.image.outputs.name }}:buildcache-${{ matrix.arch }},mode=max,ignore-error=true
      - name: Record the digest
        run: mkdir -p digests && touch "digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docker-digest-${{ matrix.arch }}
          path: digests/*
          retention-days: 1

  merge:
    name: Docker image
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      # GitHub's build provenance attestation for the multi-arch image (see the last step).
      id-token: write
      attestations: write
    env:
      # Optional Docker Hub mirror: the DOCKERHUB_IMAGE variable (e.g. `atlastodo/atlas-todo`) plus the
      # DOCKERHUB_USERNAME and DOCKERHUB_TOKEN secrets. Skipped while the repository is private,
      # because Docker Hub creates a new repository as public.
      DOCKERHUB_IMAGE: ${{ !github.event.repository.private && vars.DOCKERHUB_IMAGE || '' }}
      # Optional extra names for the same image (the image-aliases input, else the IMAGE_ALIASES
      # variable): after the repository split the core repo keeps publishing the old
      # ghcr.io/atlastodo/atlas-todo name next to its own for a deprecation period
      # (docs/repo-split.md). Unset, nothing changes.
      IMAGE_ALIASES: ${{ inputs.image-aliases || vars.IMAGE_ALIASES || '' }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: docker-digest-*
          path: digests
          merge-multiple: true
      - name: Image name
        id: image
        run: |
          name="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          # The aliases, checked: lowercase ghcr.io/ or docker.io/ names, never the primary name
          # again. A docker.io one needs the Docker Hub mirror's login (DOCKERHUB_IMAGE set, a
          # public repository); without it the alias is skipped like the mirror is.
          aliases=()
          for alias in $IMAGE_ALIASES; do
            if [[ ! "$alias" =~ ^(ghcr|docker)\.io/[a-z0-9._-]+/[a-z0-9._/-]+$ ]]; then
              echo "::error::Image alias '$alias' is not a lowercase ghcr.io/<owner>/<name> or docker.io/<owner>/<name>."
              exit 1
            fi
            if [[ "$alias" == docker.io/* && -z "$DOCKERHUB_IMAGE" ]]; then
              echo "::warning::Skipping the alias $alias: the Docker Hub mirror is off (DOCKERHUB_IMAGE unset or a private repository)."
              continue
            fi
            [ "$alias" = "$name" ] || [ "$alias" = "docker.io/$DOCKERHUB_IMAGE" ] || aliases+=("$alias")
          done
          {
            echo "aliases<<ALIASES"
            if [ "${#aliases[@]}" -gt 0 ]; then printf '%s\n' "${aliases[@]}"; fi
            echo "ALIASES"
          } >> "$GITHUB_OUTPUT"
          if [ "${#aliases[@]}" -gt 0 ]; then
            echo "Also tagged as: ${aliases[*]}" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: env.DOCKERHUB_IMAGE != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index
        with:
          images: |
            ${{ steps.image.outputs.name }}
            ${{ steps.image.outputs.aliases }}
            ${{ env.DOCKERHUB_IMAGE && format('docker.io/{0}', env.DOCKERHUB_IMAGE) || '' }}
          tags: ${{ inputs.tags }}
          flavor: ${{ inputs.flavor }}
          annotations: ${{ env.IMAGE_METADATA }}
      - name: Tag the multi-arch image
        id: tag
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          args=()
          while IFS= read -r tag; do args+=(-t "$tag"); done < <(jq -r '.tags[]' <<<"$DOCKER_METADATA_OUTPUT_JSON")
          while IFS= read -r a; do args+=(--annotation "$a"); done < <(jq -r '.annotations[]' <<<"$DOCKER_METADATA_OUTPUT_JSON")
          for digest in digests/*; do args+=("$IMAGE@sha256:${digest#digests/}"); done
          docker buildx imagetools create "${args[@]}"
          version="$(jq -r '.labels["org.opencontainers.image.version"]' <<<"$DOCKER_METADATA_OUTPUT_JSON")"
          docker buildx imagetools inspect "$IMAGE:$version"
          echo "digest=$(docker buildx imagetools inspect "$IMAGE:$version" --format '{{.Manifest.Digest}}')" >> "$GITHUB_OUTPUT"
      # Verify with: gh attestation verify oci://ghcr.io/atlastodo/atlas-todo:<tag> --repo atlastodo/atlas-todo
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.tag.outputs.digest }}
          push-to-registry: true
