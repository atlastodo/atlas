# Lint + test for every push to main and every PR, or on demand. A push or PR only runs the jobs
# whose files changed (see `changes`); the audits and MSRV run when dependencies change and once a
# week. release.yml calls this same workflow on a v* tag, so a release is gated on the full suite.
# Pushes to dev run it through dev-image.yml, which publishes the `dev` Docker tag when it passes.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

concurrency:
  # Literal "ci-" prefix: when release.yml calls this workflow, github.workflow is the caller's
  # name, and a group shared with the caller would make this run wait on its own parent.
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # A newer push supersedes the run still going for the previous one.
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  NODE_VERSION: "26"
  CARGO_TERM_COLOR: always
  # Incremental artifacts are useless in near-clean CI builds and bloat the cache.
  CARGO_INCREMENTAL: "0"

jobs:
  # Decides which jobs run. A tag, a manual run or a call from release.yml runs everything; the
  # weekly schedule runs only the audits and MSRV. The branch push of a release commit
  # (`chore(release): vX.Y.Z`) runs nothing: its tag is pushed in the same breath and release.yml
  # runs the full suite for that commit.
  changes:
    name: Changes
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      lint_ts: ${{ steps.filter.outputs.lint_ts }}
      test_ts: ${{ steps.filter.outputs.test_ts }}
      deps: ${{ steps.filter.outputs.deps }}
    steps:
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set_all() { for k in rust lint_ts test_ts deps; do echo "$k=$1" >>"$GITHUB_OUTPUT"; done; }
          case "$EVENT" in
            schedule)
              set_all false
              echo "deps=true" >>"$GITHUB_OUTPUT"
              exit 0
              ;;
            push)
              if [ "$REF_TYPE" = tag ] || [[ "$BEFORE" =~ ^0*$ ]]; then set_all true; exit 0; fi
              if [[ "$HEAD_MESSAGE" == "chore(release):"* ]]; then set_all false; exit 0; fi
              files="$(gh api "repos/$REPO/compare/$BEFORE...$SHA" --jq '.files[].filename')"
              ;;
            pull_request)
              files="$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename')"
              ;;
            *)
              set_all true
              exit 0
              ;;
          esac
          # The compare API lists at most 300 files; past that, assume everything changed.
          if [ "$(grep -c . <<<"$files")" -ge 300 ]; then set_all true; exit 0; fi
          ci='^(\.github/workflows/ci\.yml|\.bun-version)$'
          rust="^(crates/|migrations/|Cargo\.(toml|lock)$|rust-toolchain\.toml$|\.config/nextest\.toml$|deny\.toml$)|$ci"
          shared="^(packages/|package\.json$|bun\.lock$|test-vectors/|manifests/)|$ci"
          deps="^(Cargo\.(toml|lock)|deny\.toml|bun\.lock|package\.json|crates/[^/]+/Cargo\.toml|packages/[^/]+/package\.json)$|$ci"
          has() { if grep -qE "$1" <<<"$files"; then echo true; else echo false; fi; }
          # Prettier checks Markdown, YAML and JSON too, so anything outside the Rust tree lints.
          lints() { if grep -vE "$rust" <<<"$files" | grep -q .; then echo true; else has "$ci"; fi; }
          {
            # The server compiles manifests/ in, and the Rust client asserts test-vectors/; kept out of
            # $rust so Prettier still lints them.
            echo "rust=$(has "$rust|^manifests/|^test-vectors/")"
            echo "lint_ts=$(lints)"
            echo "test_ts=$(has "$shared|^scripts/(build|pack|smoke)-core-packages?\.")"
            echo "deps=$(has "$deps")"
          } >>"$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  lint-rust:
    name: Lint (Rust)
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust (rust-toolchain.toml)
        run: |
          rustup toolchain install --no-self-update
          # rust-cache keys on every installed toolchain, so the runner image's preinstalled stable
          # would change the key (and miss the cache) each time the image bumps it. Keep only ours.
          ours="$(rustup show active-toolchain | cut -d" " -f1)"
          rustup toolchain list | cut -d" " -f1 | grep -vxF "$ours" | xargs -r -n1 rustup toolchain uninstall
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # PR caches are only visible to that PR; main's are visible to every run, and dev's to
          # dev pushes, where the work lands.
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' }}
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked --no-deps -- -D warnings

  lint-ts:
    name: Lint (TypeScript)
    needs: changes
    if: ${{ needs.changes.outputs.lint_ts == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      # Every workspace that defines `typecheck`: the core packages.
      - run: bun run --parallel --filter '*' typecheck
      # The licences of the JS packages the builds ship, against an allow-list.
      - run: node scripts/third-party-licenses.mjs --check
      # devenv.lock's copy of the flake's nixpkgs and rust-overlay must match flake.lock.
      - run: node scripts/check-devenv-lock.mjs
      - run: bunx oxlint .
      - run: bunx prettier --check .

  msrv:
    name: MSRV
    needs: changes
    if: ${{ needs.changes.outputs.deps == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the workspace rust-version
        # Read from Cargo.toml so raising the MSRV is a one-line manifest change.
        run: |
          msrv="$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)"
          test -n "$msrv" || { echo "::error::No rust-version in Cargo.toml"; exit 1; }
          rustup toolchain install "$msrv" --profile minimal --no-self-update
          # Overrides rust-toolchain.toml, which names the everyday toolchain, for the rest of the job.
          echo "RUSTUP_TOOLCHAIN=$msrv" >> "$GITHUB_ENV"
          # rust-cache keys on every installed toolchain, so the runner image's preinstalled stable
          # would change the key (and miss the cache) each time the image bumps it. Keep only ours.
          rustup toolchain list | cut -d" " -f1 | grep -v "^$msrv-" | xargs -r -n1 rustup toolchain uninstall
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' }}
      - run: cargo check --workspace --all-targets --locked

  test-rust:
    name: Test (Rust)
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: atlas_test
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atlas -d atlas_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # The atlas-server integration tests migrate this database themselves.
      TEST_DATABASE_URL: postgres://atlas:atlas@localhost:5432/atlas_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust (rust-toolchain.toml)
        run: |
          rustup toolchain install --no-self-update
          # rust-cache keys on every installed toolchain, so the runner image's preinstalled stable
          # would change the key (and miss the cache) each time the image bumps it. Keep only ours.
          ours="$(rustup show active-toolchain | cut -d" " -f1)"
          rustup toolchain list | cut -d" " -f1 | grep -vxF "$ours" | xargs -r -n1 rustup toolchain uninstall
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' }}
      # Prebuilt, checksum-verified binary; version matches devenv's.
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-nextest@0.9.143
          fallback: none
      # .config/nextest.toml serializes the tests that share the instance_settings row.
      - run: cargo nextest run --workspace --locked

  test-ts:
    name: Test (TypeScript)
    needs: changes
    if: ${{ needs.changes.outputs.test_ts == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      # `--bun` runs vitest itself under Bun's runtime; these suites are runtime-agnostic pure TS.
      - name: client-core
        working-directory: packages/client-core
        run: bunx --bun vitest run
      - name: shared
        working-directory: packages/shared
        run: bunx --bun vitest run
      - name: sdk
        working-directory: packages/sdk
        run: bunx --bun vitest run
      # The npm tarballs the release attaches, packed and installed as another repository would.
      - name: Pack the core packages
        run: |
          scripts/pack-core-packages.sh "$RUNNER_TEMP/packages"
          scripts/smoke-core-packages.sh "$RUNNER_TEMP/packages"

  # The audits surface advisories without blocking: they often sit in un-updatable transitive
  # deps. Fixable ones go in `overrides` (JS) or a dependency bump, never an ignore list.
  audit-rust:
    name: Audit (Rust)
    needs: changes
    if: ${{ needs.changes.outputs.deps == 'true' }}
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust (rust-toolchain.toml)
        run: rustup toolchain install --no-self-update
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-deny@0.20.2
          fallback: none
      # Advisories, licences, bans and sources, per deny.toml.
      - run: cargo deny check

  audit-js:
    name: Audit (JS)
    needs: changes
    if: ${{ needs.changes.outputs.deps == 'true' }}
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      # Reads bun.lock only; no install needed.
      - run: bun audit
