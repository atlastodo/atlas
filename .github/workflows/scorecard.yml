# OpenSSF Scorecard: scores the repository's supply-chain practices (pinned actions, token
# permissions, branch protection, …), shows the findings under Security → Code scanning, and
# publishes the score for the README badge. Runs on main only: the badge reads the default branch.
name: Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard
    runs-on: ubuntu-24.04
    permissions:
      # Upload the findings to code scanning.
      security-events: write
      # Publish the results, so the badge and api.scorecard.dev can show them.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: results.sarif
