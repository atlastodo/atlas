# Self-hosting stack: Postgres + the unified Atlas Todo container (API + static web frontend).
#
# Usage, from the repo root (the root compose.yaml includes this file, so the root .env is read):
#   cp .env.example .env      # set POSTGRES_PASSWORD and JWT_SECRET
#   docker compose up -d      # pulls the published image; add --build to build this checkout
#
# Every server setting is read from that .env (see .env.example for the full list); the
# `environment:` block below only holds what compose itself must decide.
name: atlas-todo

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-atlas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-atlas}
      # UTF-8 encoding, so non-ASCII content (Danish æøå, …) is stored safely. Only applied
      # when the data volume is first created; an existing volume keeps its encoding.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    volumes:
      - atlas_db:/var/lib/postgresql/data
    healthcheck:
      # $$ reads the container's own env, so no host shell variable leaks into the probe.
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 5

  # Unified container: atlas-server (Axum) serving the React Native Web export from /app/dist.
  # `docker compose up -d --build` builds it from this checkout; `docker compose pull` fetches the
  # published image named below instead.
  server:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: ${ATLAS_IMAGE:-ghcr.io/atlastodo/atlas-todo:latest}
    restart: unless-stopped
    # tini as PID 1: forwards SIGTERM to the server (which shuts down gracefully) and reaps zombies.
    init: true
    depends_on:
      db:
        condition: service_healthy
    env_file:
      # The repo-root .env (the documented setup). A .env next to this file is read too, for
      # tools that run `-f docker/docker-compose.yml` and write their env there (e.g. Dokploy).
      - path: ../.env
        required: false
      - path: .env
        required: false
    environment:
      # Built from the POSTGRES_* values so the password lives in one place. Deliberately not
      # ${DATABASE_URL}: a devenv shell exports one that points at the local dev database.
      DATABASE_URL: postgres://${POSTGRES_USER:-atlas}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-atlas}
      # The container always listens on 8080. PORT_BIND publishes it on localhost only by default, for
      # a reverse proxy on the same host; set it to 8080 to listen on every interface.
      PORT: "8080"
      # Every interface of the container, whatever BIND_ADDR .env sets for a bare binary.
      BIND_ADDR: "0.0.0.0"
    ports:
      - "${PORT_BIND:-127.0.0.1:8080}:8080"
    volumes:
      # Attachment blobs (BLOB_DIR defaults to /app/data/blobs). Without this volume every
      # container recreate would delete them.
      - atlas_data:/app/data

volumes:
  atlas_db:
    # Fixed name: before the project was named atlas-todo, compose derived "docker" from this
    # directory, so existing installs keep their database. A deployment started with its own
    # project name (`-p <name>`, as Dokploy does) must set ATLAS_DB_VOLUME=<name>_atlas_db.
    name: ${ATLAS_DB_VOLUME:-docker_atlas_db}
  atlas_data:
