[workspace]
resolver = "2"
members = ["crates/atlas-core", "crates/atlas-server"]

[workspace.package]
version = "0.1.10-rc.2"
edition = "2021"
license = "AGPL-3.0-only"
repository = "https://github.com/atlastodo/atlas-todo"
homepage = "https://github.com/atlastodo/atlas-todo"
rust-version = "1.94"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v5", "v7", "serde"] }
time = { version = "0.3", features = ["serde", "macros"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Every signup and login in the server's integration tests hashes a password with Argon2, which is
# many times slower unoptimized: optimizing just the hash crates cuts the suite by about 4x, while
# optimizing every dependency gains little more.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
